<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create element</title>
</head>
<body style="background-color: grey; color: orange;">
    
</body>
<script>
    const div = document.createElement('div')
    console.log(div)
    div.className = 'main'
    div.id = Math.random()*10+1
    div.setAttribute('detail', 'generated detail')
 //   div.innerText = 'Hello'
    //All these would override the previous values except setattribute but setAttribute directly sets the values
    //Till now all this is happening in console as the div is stored in memory, for displaying the results in the webpage, we would need to attach it to the document
    const name = document.createTextNode("Hello")
    div.appendChild(name)
    document.body.appendChild(name)
</script>
</html>
